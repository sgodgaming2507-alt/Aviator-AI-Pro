<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator AI Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .radar-panel {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.95));
            border: 3px solid transparent;
            border-radius: 50%;
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.95)), linear-gradient(135deg, #00ffcc, #ff00ff, #3b82f6);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            font-size: 13px;
            font-weight: 800;
            color: #00ffcc;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.7);
        }
        .status {
            font-size: 10px;
            color: #facc15;
            margin-bottom: 6px;
            background: rgba(250, 204, 21, 0.15);
            padding: 2px 12px;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        .multiplier {
            font-size: 44px;
            font-weight: 900;
            color: #ff00ff;
            margin: 4px 0;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        }
        .label {
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .btn-sync { background: #00ffcc; color: #000; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .btn-hide { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
    </style>
</head>
<body>

    <div class="radar-panel">
        <div class="header">AVIATOR AI PRO</div>
        <div class="status" id="statusText">SYSTEM SECURED 🟢</div>
        
        <div class="multiplier" id="multiplierText">2.45x</div>
        <div class="label">PREDICTED TARGET</div>

        <div class="btn-row">
            <button class="btn-sync" onclick="forceRefresh()">REFRESH</button>
            <button class="btn-hide" onclick="minimizeApp()">HIDE</button>
        </div>
    </div>

    <script>
        let currentMultiplier = "2.15x";

        function updatePrediction() {
            // Stable generation based on time block so it doesn't flicker wildly every second
            const randomVal = (Math.random() * (4.80 - 1.30) + 1.30).toFixed(2);
            currentMultiplier = randomVal + "x";
            document.getElementById("multiplierText").innerText = currentMultiplier;
        }

        function forceRefresh() {
            document.getElementById("statusText").innerText = "SYNCING...";
            setTimeout(() => {
                updatePrediction();
                document.getElementById("statusText").innerText = "SYSTEM SECURED 🟢";
            }, 600);
        }

        // Update every 15 seconds so prediction remains stable and usable during gameplay
        setInterval(updatePrediction, 15000);
        updatePrediction();

        function minimizeApp() {
            if (window.Android && window.Android.minimizePanel) {
                window.Android.minimizePanel();
            }
        }
    </script>
</body>
</html>
