<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: transparent; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .circle-panel {
            width: 250px;
            height: 250px;
            background: rgba(5, 10, 20, 0.96);
            border-radius: 50%;
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(5, 10, 20, 0.96), rgba(5, 10, 20, 0.96)), linear-gradient(135deg, #00ffcc, #ff00ff, #3b82f6);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6), inset 0 0 20px rgba(59, 130, 246, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.4), inset 0 0 10px rgba(59, 130, 246, 0.3); }
            100% { box-shadow: 0 0 35px rgba(255, 0, 255, 0.7), inset 0 0 20px rgba(0, 255, 204, 0.5); }
        }

        .header-tag { 
            font-size: 9px; 
            font-weight: 800; 
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc; 
            border: 1px solid #00ffcc;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        
        .sub-title {
            font-size: 8px;
            color: #94a3b8;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .result-box {
            font-size: 28px;
            font-weight: 900;
            color: #ff00ff;
            text-shadow: 0 0 12px rgba(255, 0, 255, 0.8);
            margin: 4px 0;
            letter-spacing: 1px;
        }

        .status-box {
            font-size: 7.5px;
            color: #facc15;
            background: rgba(250, 204, 21, 0.1);
            border: 1px dashed #facc15;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 4px 0;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
            margin-top: 6px;
        }

        button { 
            border: none; 
            padding: 4px 10px; 
            font-weight: bold; 
            font-size: 9px; 
            border-radius: 6px; 
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
        }
        
        .refresh-btn { background: #00ffcc; color: #000; box-shadow: 0 0 8px rgba(0,255,204,0.5); }
        .hide-btn { background: #ffaa00; color: #000; }
        .close-btn { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="circle-panel">
        <div class="header-tag">AVIATOR AI PRO</div>
        <div class="sub-title">RADAR: <span id="radar-status" style="color:#00ffcc;">SCANNING</span></div>
        
        <div class="result-box" id="prediction">1.00x</div>
        <div class="status-box" id="analytics-status">AI Model: Active</div>

        <div class="btn-group">
            <button class="refresh-btn" onclick="triggerRefresh()">REFRESH</button>
            <button class="hide-btn" onclick="Android.minimizePanel()">HIDE</button>
            <button class="close-btn" onclick="Android.closeApp()">EXIT</button>
        </div>
    </div>

    <script>
        function generatePrediction() {
            // Generates a stable realistic Aviator flight multiplier between 1.20x and 5.80x
            const randomVal = (Math.random() * (5.80 - 1.20) + 1.20).toFixed(2);
            document.getElementById("prediction").innerText = randomVal + "x";
            
            // Color grading based on multiplier height
            const predElement = document.getElementById("prediction");
            if (parseFloat(randomVal) > 3.5) {
                predElement.style.color = "#00ffcc"; // High neon cyan
                predElement.style.textShadow = "0 0 15px rgba(0, 255, 204, 0.9)";
            } else {
                predElement.style.color = "#ff00ff"; // Pinkish magenta
                predElement.style.textShadow = "0 0 15px rgba(255, 0, 255, 0.9)";
            }
        }

        function triggerRefresh() {
            document.getElementById("analytics-status").innerText = "Syncing Signal...";
            document.getElementById("prediction").innerText = "...";
            setTimeout(() => {
                generatePrediction();
                document.getElementById("analytics-status").innerText = "AI Model: Active";
            }, 700);
        }

        // Auto refresh prediction every 12 seconds
        setInterval(generatePrediction, 12000);
        generatePrediction();
    </script>
</body>
</html>
